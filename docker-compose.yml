# =============================================================================
# Muse — full stack (postgres + hifi-api + backend API + backend worker + frontend)
# =============================================================================
# Usage:
#   1. cp Backend/.env.example Backend/.env   # fill in LASTFM_API_KEY etc.
#   2. docker compose up --build
#
# Service ports (host:container):
#   postgres     5432:5432
#   hifi-api     8000:8000
#   backend-api  5000:5000
#   frontend     3000:3000
# =============================================================================

services:
  # ── PostgreSQL database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: muse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d muse"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Python FastAPI hi-fi streaming/metadata service ────────────────────────
  hifi-api:
    build: ./hifi-api
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Node Fastify API ───────────────────────────────────────────────────────
  backend-api:
    build: ./Backend
    image: muse-backend
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      hifi-api:
        condition: service_started
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      # Connect to the postgres service over the compose network.
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/muse
      # Talk to the hifi-api service over the compose network.
      TIDAL_API_BASE_URL: http://hifi-api:8000
      # Pass LASTFM_API_KEY through from the host env if set (falls back to the
      # value in Backend/.env via env_file). Without it, discovery/recommendations
      # silently degrade. Set JWT_SECRET in Backend/.env for a real deployment.
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
    restart: unless-stopped

  # ── Node background worker (same image as backend-api) ─────────────────────
  backend-worker:
    build: ./Backend
    image: muse-backend
    command: ["node", "dist/workers/runner.js"]
    depends_on:
      postgres:
        condition: service_healthy
      hifi-api:
        condition: service_started
      backend-api:
        condition: service_started
    env_file:
      - ./Backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/muse
      TIDAL_API_BASE_URL: http://hifi-api:8000
      LASTFM_API_KEY: ${LASTFM_API_KEY:-}
    restart: unless-stopped

  # ── Next.js frontend ───────────────────────────────────────────────────────
  frontend:
    build:
      context: ./Frontend
      args:
        # Browser-side calls hit the host-published backend port.
        NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend-api
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5000
    restart: unless-stopped

volumes:
  # Named volume for the PostgreSQL data directory.
  postgres-data:
